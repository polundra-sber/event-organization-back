name: Backend CI

on:
  push:
    branches:
      - feature/devops-coursework

  pull_request:
    branches:
      - feature/devops-coursework

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Java, Docker and publish GHCR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 23
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '23'
          cache: maven

      - name: Build and verify backend
        run: mvn -B -ntp clean verify

      - name: Check JAR file
        run: test -s target/event-organization-1.0.2-SNAPSHOT.jar

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/polundra-sber/event-organization-back \
            -t eventorg-back:ci .

      - name: Check Java inside Docker
        run: docker run --rm --entrypoint java eventorg-back:ci -version

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/polundra-sber/event-organization-back
        run: |
          SHA_TAG="sha-${GITHUB_SHA:0:12}"

          docker tag eventorg-back:ci "$IMAGE:dev"
          docker tag eventorg-back:ci "$IMAGE:$SHA_TAG"

          docker push "$IMAGE:dev"
          docker push "$IMAGE:$SHA_TAG"